name: Publish The Preprint

on:
  schedule:
    # 06:30 UTC (07:30 CET): after arXiv refreshes its announcement feeds (~05:00 UTC).
    # The old 02:00 UTC slot often caught the previous day's feed or an empty one.
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      notify:
        description: 'Post to Discord'
        type: boolean
        default: true
      no_llm:
        description: 'Skip the LLM (heuristic ranking only)'
        type: boolean
        default: false
      rebuild:
        description: "Rebuild today's issues even if they already exist (spends LLM quota)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a run midway — it may be between committing data and deploying.
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build editions
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        # Manual re-runs keep today's existing issues unless "rebuild" is ticked.
        run: npm run build:editions -- ${{ !inputs.rebuild && '--skip-existing' || '' }} ${{ inputs.no_llm && '--no-llm' || '' }}

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "chore: publish issues for $(date -u +%F) [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build site
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Post to Discord
        if: ${{ github.event_name == 'schedule' || inputs.notify }}
        env:
          DASHBOARD_URL: ${{ steps.deployment.outputs.page_url }}
          DISCORD_GENERAL_WEBHOOK_URL: ${{ secrets.DISCORD_GENERAL_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MEDICAL_WEBHOOK_URL: ${{ secrets.DISCORD_MEDICAL_WEBHOOK_URL }}
          DISCORD_EDUCATION_WEBHOOK_URL: ${{ secrets.DISCORD_EDUCATION_WEBHOOK_URL }}
        run: npm run send:discord
